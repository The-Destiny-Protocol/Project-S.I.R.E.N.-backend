# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml
# Single-service deployment: FastAPI + Discord bot run in the same process.
#
# Usage:
#   docker compose up --build          # first run / after changes
#   docker compose up -d               # detached (background)
#   docker compose logs -f api         # tail logs
#   docker compose down                # stop and remove containers
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI / Uvicorn + Discord Bot (unified process) ──────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    volumes:
      # Mount source for live reload during development.
      # Remove this volume block for a production deployment.
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
